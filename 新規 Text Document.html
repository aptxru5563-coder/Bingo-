<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git コミット・差分ビュー</title>
  <style>
    /* Git コミットログ・差分ビュー用スタイル */
    :root {
      --git-bg: #0d1117;
      --git-surface: #161b22;
      --git-border: #30363d;
      --git-text: #e6edf3;
      --git-muted: #8b949e;
      --git-add-bg: rgba(46, 160, 67, 0.15);
      --git-add-text: #3fb950;
      --git-del-bg: rgba(248, 81, 73, 0.15);
      --git-del-text: #f85149;
      --git-branch-bg: rgba(56, 139, 253, 0.15);
      --git-branch-text: #58a6ff;
    }

    body {
      background-color: #010409;
      color: var(--git-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
    }

    .git-panel {
      max-width: 720px;
      margin: 0 auto 20px;
      background-color: var(--git-bg);
      color: var(--git-text);
      border: 1px solid var(--git-border);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      overflow: hidden;
    }

    .git-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: var(--git-surface);
      border-bottom: 1px solid var(--git-border);
    }

    .git-branch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background-color: var(--git-branch-bg);
      color: var(--git-branch-text);
      font-size: 12px;
      font-weight: 600;
    }

    .git-commit-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .git-commit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--git-border);
    }

    .git-commit-item:last-child {
      border-bottom: none;
    }

    .git-hash {
      color: var(--git-branch-text);
      background-color: var(--git-surface);
      border: 1px solid var(--git-border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }

    .git-diff-line {
      padding: 2px 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .git-diff-add {
      background-color: var(--git-add-bg);
      color: var(--git-add-text);
    }

    .git-diff-add::before {
      content: "+ ";
    }

    .git-diff-del {
      background-color: var(--git-del-bg);
      color: var(--git-del-text);
    }

    .git-diff-del::before {
      content: "- ";
    }
  </style>
</head>
<body>

  <!-- コミット一覧パネル -->
  <div class="git-panel">
    <div class="git-header">
      <span class="git-branch">main</span>
      <span>Commits</span>
    </div>
    <ul class="git-commit-list">
      <li class="git-commit-item">
        <span class="git-hash">a1b2c3d</span>
        <span>ビンゴ抽選機の履歴表示を追加</span>
      </li>
      <li class="git-commit-item">
        <span class="git-hash">9e8f7a6</span>
        <span>初期レイアウトを作成</span>
      </li>
    </ul>
  </div>

  <!-- 差分（diff）パネル -->
  <div class="git-panel">
    <div class="git-header">
      <span>bingo.html</span>
      <span>Diff</span>
    </div>
    <div class="git-diff-line git-diff-del">const MAX_NUMBER = 90;</div>
    <div class="git-diff-line git-diff-add">const MAX_NUMBER = 75;</div>
  </div>

</body>
</html>
