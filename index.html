<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git風 ビンゴ抽選機</title>
  <style>
    :root {
      --git-bg: #0d1117;
      --git-surface: #161b22;
      --git-border: #30363d;
      --git-text: #e6edf3;
      --git-muted: #8b949e;
      --git-add-bg: rgba(46, 160, 67, 0.15);
      --git-add-text: #3fb950;
      --git-del-bg: rgba(248, 81, 73, 0.15);
      --git-del-text: #f85149;
      --git-branch-bg: rgba(56, 139, 253, 0.15);
      --git-branch-text: #58a6ff;
    }

    body {
      background-color: #010409;
      color: var(--git-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
    }

    .git-panel {
      max-width: 720px;
      margin: 0 auto 20px;
      background-color: var(--git-bg);
      color: var(--git-text);
      border: 1px solid var(--git-border);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      overflow: hidden;
    }

    .git-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: var(--git-surface);
      border-bottom: 1px solid var(--git-border);
    }

    .git-branch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background-color: var(--git-branch-bg);
      color: var(--git-branch-text);
      font-size: 12px;
      font-weight: 600;
    }

    .bingo-body {
      padding: 20px;
      text-align: center;
    }

    .current-number-box {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.2;
      margin: 12px 0 18px;
      color: var(--git-add-text);
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid var(--git-border);
      cursor: pointer;
    }

    .btn-draw {
      background-color: #238636;
      color: #ffffff;
      border-color: rgba(240, 246, 252, 0.1);
    }

    .btn-draw:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-reset {
      background-color: var(--git-surface);
      color: var(--git-text);
    }

    .history-title {
      text-align: left;
      color: var(--git-muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-badge {
      padding: 4px 10px;
      border-radius: 6px;
      background-color: var(--git-surface);
      border: 1px solid var(--git-border);
      font-size: 13px;
    }

    .git-commit-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .git-commit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--git-border);
    }

    .git-commit-item:last-child {
      border-bottom: none;
    }

    .git-hash {
      color: var(--git-branch-text);
      background-color: var(--git-surface);
      border: 1px solid var(--git-border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }

    .git-diff-line {
      padding: 2px 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .git-diff-add {
      background-color: var(--git-add-bg);
      color: var(--git-add-text);
    }

    .git-diff-add::before {
      content: "+ ";
    }

    .git-diff-del {
      background-color: var(--git-del-bg);
      color: var(--git-del-text);
    }

    .git-diff-del::before {
      content: "- ";
    }
  </style>
</head>
<body>

  <!-- ビンゴ抽選機パネル -->
  <div class="git-panel">
    <div class="git-header">
      <span class="git-branch">bingo-engine</span>
      <span id="remain-label">残り: 75 / 75</span>
    </div>
    <div class="bingo-body">
      <div>現在の番号</div>
      <div id="current-number" class="current-number-box">--</div>
      <div class="btn-row">
        <button id="draw-btn" class="btn-draw" type="button">番号を抽選する</button>
        <button id="reset-btn" class="btn-reset" type="button">リセット</button>
      </div>
      <div class="history-title">出た番号の履歴（新しい順）</div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>
